<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BART Station Map Demo | CP101</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,Arial;background:#f5f8fc;color:#193449}header{padding:14px 18px;background:#12304c;color:white}h1{font-size:1.2rem;margin:0 0 4px}header p{margin:0;font-size:.85rem}#map{height:76vh;min-height:440px}.note{padding:12px 18px;font-size:.85rem}</style></head><body><header><h1>East Bay BART Stations — Interactive Demonstration</h1><p>CP101 Lab 10 · Approximate station locations and illustrative 800 m circles</p></header><div id="map"></div><div class="note">These circles are straight-line distances, <strong>not</strong> walking distances. Sample map only: no rental price measurements or results are shown.</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map').setView([37.850,-122.269],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(m);const sites=[['Downtown Berkeley',37.870,-122.268],['North Berkeley',37.874,-122.283],['Ashby',37.853,-122.270],['MacArthur',37.829,-122.268],['Rockridge',37.845,-122.252],['19th St Oakland',37.808,-122.269]];sites.forEach(([name,lat,lon])=>{L.marker([lat,lon]).addTo(m).bindPopup('<b>'+name+'</b><br>Approximate BART station location');L.circle([lat,lon],{radius:800,color:'#e16a8d',weight:2,fillOpacity:.11}).addTo(m)});</script></body></html>
